<body>

  <!-- ===================== شاشة الدخول ===================== -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <? if (LOGIN_LOGO_URI) { ?>
        <img class="login-logo" src="<?!= LOGIN_LOGO_URI ?>" alt="شعار وزارة الصحة">
      <? } ?>
      <div class="brand">منصة أثر</div>
      <div class="brand-sub">للمبادرات الصحية</div>
      <div class="org-name">

        <input id="empNo" type="text" inputmode="numeric" placeholder="مثال: 12345" autocomplete="off">

      <div class="login-actions">
        <button class="btn btn-primary btn-large" id="loginBtn" onclick="doLogin()">دخول المنصة</button>
        <button class="btn btn-ghost btn-large install-btn" onclick="installApp()">تثبيت التطبيق</button>
      </div>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <!-- ===================== التطبيق ===================== -->

    <header class="topbar">
      <div class="topbar-inner">
        <div class="logo-box">
          <? if (APP_LOGO_URI) { ?>
            <img src="<?!= APP_LOGO_URI ?>" alt="شعار وزارة الصحة">

          <? } ?>
        </div>
        <div class="org">
          <h1>المديرية العامة للخدمات الصحية بمحافظة ظفار</h1>

        </div>
        <div class="app-title"><span>منصة أثر</span><strong>للمبادرات الصحية</strong></div>
        <div class="topbar-spacer"></div>
        <span id="pending" class="pending hidden"></span>

          </div>

          <span id="whoTitle"></span>
        </div>
        <button class="btn-logout" onclick="logout()">خروج</button>
      </div>
    </header>

    <div class="cover"><span class="tag">توثيق الفعاليات والمبادرات</span></div>

    <nav class="tabs"><div class="tabs-inner" id="tabsBar"></div></nav>
