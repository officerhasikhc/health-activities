<style>
:root{
    --bg:#f4f5f7; --surface:#ffffff; --ink:#1d2733; --muted:#5b6b7b;
    --line:#dfe4ea; --line-strong:#c7d0d9;
    --brand:#1a4d5c;          /* أخضر مزرقّ رسمي هادئ */
    --brand-deep:#123a46;
    --accent:#9a7b3f;         /* ذهبي مكتوم للتفاصيل */
    --ok:#1e7d52; --err:#b23b3b; --warn:#9a7b3f;
    --radius:6px; --shadow:0 1px 2px rgba(16,34,46,.06),0 1px 3px rgba(16,34,46,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Cairo","Segoe UI","Tahoma",Arial,sans-serif;
    background:var(--bg); color:var(--ink); direction:rtl; text-align:right;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand)}
  .hidden{display:none !important}

  /* ===== الترويسة ===== */
  header.topbar{
    background:linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%);
    color:#eef3f4; border-bottom:3px solid var(--accent);
  }
  .topbar-inner{max-width:1080px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
    display:flex;align-items:center;gap:14px;position:relative}
  .logo-box{width:52px;height:52px;border:1px solid rgba(255,255,255,.35);
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#cfe0e3;flex:0 0 auto;background:rgba(255,255,255,.92);overflow:hidden}
  .logo-box img{width:44px;height:44px;object-fit:contain;transform:translateY(2px)}
  .org h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .org p{font-size:12px;margin:2px 0 0;color:#bcd2d6}
  .app-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center;white-space:nowrap;line-height:1.15}
  .app-title span{font-size:20px;font-weight:700;letter-spacing:0}
  .app-title strong{font-size:12px;font-weight:500;color:#c9dcdf;letter-spacing:0}
  .topbar-spacer{flex:1}
  .who{font-size:12.5px;text-align:left;color:#dfe9ea;display:flex;align-items:center;gap:10px}
  .who b{display:block;font-size:13px;color:#fff;line-height:1.2}
  .bell-wrap{position:relative;display:inline-flex;align-items:center}
  .bell-icon{position:relative;cursor:pointer;font-size:18px;margin-left:4px;transition:transform 0.2s}
  .bell-icon:hover{transform:scale(1.1)}
  .bell-badge{position:absolute;top:-4px;right:-6px;background:var(--err);color:#fff;font-size:10px;font-weight:bold;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;line-height:1.2}
  .bell-panel{position:absolute;top:100%;margin-top:8px;inset-inline-start:0;width:320px;max-height:380px;overflow-y:auto;background:#fff;color:#1f2d33;border:1px solid #dde4e6;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:1000;text-align:right;font-size:12.5px}
  .bell-panel.hidden{display:none}
  .bell-head{padding:8px 12px;border-bottom:1px solid #eef1f2;font-weight:700;color:#1a4d5c;background:#f7fafb;border-radius:8px 8px 0 0}
  .bell-empty{padding:18px 12px;color:#6b7a80;text-align:center}
  .bell-item{padding:9px 12px;border-bottom:1px solid #f2f4f5;cursor:pointer;transition:background .15s}
  .bell-item:last-child{border-bottom:0}
  .bell-item:hover{background:#f3f8fa}
  .bell-item-title{font-weight:600;color:#1f2d33;margin-bottom:3px;line-height:1.35}
  .bell-item-sub{color:#6b7a80;font-size:11px;line-height:1.4}
  .nav-badge{background:var(--err);color:#fff;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:10px;margin-right:6px;animation:pulseRed 1.5s infinite;display:inline-block;vertical-align:middle}
  @keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(178,59,59,0.7)}70%{box-shadow:0 0 0 6px rgba(178,59,59,0)}100%{box-shadow:0 0 0 0 rgba(178,59,59,0)}}
  .btn-logout{background:transparent;border:1px solid rgba(255,255,255,.4);
    color:#eef3f4;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12.5px;
    margin-inline-start:4px;white-space:nowrap}
  .btn-logout:hover{background:rgba(255,255,255,.12)}
  .pending{background:rgba(154,123,63,.25);border:1px solid var(--accent);
    color:#f3e6c8;border-radius:5px;padding:4px 10px;font-size:11.5px;margin-left:6px}
  .pending.uploading::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#f3e6c8;margin-inline-end:6px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ===== لافتة خافتة (cover) ===== */
  .cover{height:96px;position:relative;overflow:hidden;
    background:
      linear-gradient(90deg,rgba(26,77,92,.92),rgba(18,58,70,.82)),
      repeating-linear-gradient(135deg,#1a4d5c 0 22px,#173f4b 22px 44px);
    border-bottom:1px solid var(--line)}
  .cover::after{content:"أثر";position:absolute;left:24px;bottom:8px;
    font-size:46px;font-weight:700;color:rgba(255,255,255,.10);letter-spacing:2px}
  .cover .tag{position:absolute;right:24px;top:50%;transform:translateY(-50%);
    color:rgba(255,255,255,.85);font-size:13px}

  /* ===== التبويبات ===== */
  nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
  .tabs-inner{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 12px}
  .tab{padding:12px 16px;cursor:pointer;color:var(--muted);font-size:13.5px;
    border-bottom:2px solid transparent;background:none;border-top:none;
    border-right:none;border-left:none;font-family:inherit}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--brand);border-bottom-color:var(--accent);font-weight:600}

  /* ===== الحاوية ===== */
  main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 4px;color:var(--brand-deep)}
  .card .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .section-divider{height:1px;background:var(--line);margin:18px 0}

  /* ===== الحقول ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1 / -1}
  label{font-size:12.5px;color:var(--ink);font-weight:600}
  label .req{color:var(--err);margin-right:2px}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line-strong);
    border-radius:6px;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fff;transition:all .2s ease}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(26,77,92,.15)}
  textarea{resize:vertical;min-height:70px}
  .readonly-box{min-height:37px;border:1px solid var(--line);border-radius:5px;
    background:#f7f9fa;color:var(--brand-deep);padding:8px 10px;font-weight:600}
  .readonly-box small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
  .invalid{border-color:var(--err) !important;box-shadow:0 0 0 3px rgba(178,59,59,.10)}
  .validation-panel{position:fixed;left:18px;top:96px;width:min(300px,calc(100vw - 36px));
    background:#fff;border:1px solid rgba(178,59,59,.45);border-right:4px solid var(--err);
    border-radius:7px;box-shadow:0 10px 30px rgba(16,34,46,.18);padding:13px 15px;
    z-index:70;color:var(--ink)}
  .validation-panel b{display:block;color:var(--err);margin-bottom:6px}
  .validation-panel ul{margin:0;padding:0 18px 0 0;color:var(--muted);font-size:12.5px}
  .validation-panel li{margin:2px 0}
  .hint{font-size:11.5px;color:var(--muted)}

  /* اختيار الفئات (شرائح) */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips.soft{margin-top:8px}
  .chip{border:1px solid var(--line-strong);border-radius:20px;padding:5px 12px;
    cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none;background:#fff}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.muted{opacity:.58}

  /* toggle الشراكة */
  .toggle-row{display:flex;align-items:center;gap:10px}
  .switch{position:relative;width:42px;height:22px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#cdd6dd;border-radius:22px;transition:.2s;cursor:pointer}
  .slider::before{content:"";position:absolute;height:16px;width:16px;right:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--brand)}
  .switch input:checked + .slider::before{transform:translateX(-20px)}

  /* قوائم الإضافة (شراكات/صور) */
  .add-row{display:flex;gap:8px}
  .add-row input{flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .tag-item{background:#eef2f4;border:1px solid var(--line);border-radius:5px;
    padding:4px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px}
  .tag-item .x{cursor:pointer;color:var(--err);font-weight:700}

  /* الصور */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:10px;margin-top:12px}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;
    border:1px solid var(--line)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumb .rm{position:absolute;top:4px;left:4px;background:rgba(178,59,59,.9);
    color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:14px}
  button.photo-thumb{padding:0;display:block;cursor:pointer;background:#f4f6f7}
  .photo-viewer{display:flex;flex-direction:column;gap:10px;align-items:center}
  .photo-viewer img{width:100%;max-height:68vh;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#f7f9fa}
  .photo-count{font-size:12px;color:var(--muted)}

  /* أزرار */
  .btn{border:none;border-radius:6px;padding:9px 18px;font-size:14px;cursor:pointer;
    font-family:inherit;font-weight:700;transition:all .2s ease;text-decoration:none;display:inline-flex;
    align-items:center;justify-content:center;gap:6px;}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none !important;box-shadow:none !important}
  .btn:focus-visible{outline:3px solid rgba(154,123,63,.35);outline-offset:2px}
  .btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .btn:not(:disabled):active{transform:translateY(0);box-shadow:none}
  
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-deep)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong)}
  .btn-ghost:hover{background:#f4f6f7;border-color:#b4c2ce}
  .btn-danger{background:var(--err);color:#fff}
  .btn-edit{background:#e8f2f4;color:var(--brand-deep);border:1px solid #bed6dc}
  .btn-edit:hover{background:#dcecef}
  .btn-print{background:#f4efe2;color:#6f5527;border:1px solid #e2d5b7}
  .btn-print:hover{background:#eee5d3}
  .btn-view{background:#eef2f4;color:var(--brand-deep);border:1px solid var(--line-strong)}
  .btn-view:hover{background:#e3ebee}
  .btn-excel{background:#e8f3ed;color:#1e6b48;border:1px solid #bcd9ca}
  .btn-excel:hover{background:#dceee5}
  .btn-pdf{background:#fff;color:var(--brand-deep);border:1px solid var(--line-strong)}
  .btn-pdf:hover{background:#f4f6f7;border-color:#b4c2ce}
  .btn-zip{background:#edf2f6;color:#31546b;border:1px solid #c8d7e1}
  .btn-zip:hover{background:#e1ebf1}
  .btn-danger-outline{background:#fff;color:var(--err);border:1px solid rgba(178,59,59,.45)}
  .btn-danger-outline:hover{background:#fff4f4;border-color:var(--err)}
  .btn-command{min-width:78px;height:34px;padding:7px 12px;border-radius:7px}
  .btn-command-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-command-primary:hover{background:var(--brand-deep)}
  .btn-icon-command{width:34px;height:34px;min-width:34px;padding:0;border-radius:6px;background:#fff;color:var(--brand-deep);border:1px solid var(--line-strong)}
  .btn-icon-command:hover{background:#f4f6f7;border-color:#b4c2ce;box-shadow:none}
  .btn-icon-command.btn-danger-text{color:var(--err);border-color:rgba(178,59,59,.22)}
  .btn-icon-command.btn-danger-text:hover{background:#fff6f6;border-color:rgba(178,59,59,.38)}
  .btn-danger-text{background:transparent;color:var(--err);border:1px solid transparent}
  .btn-danger-text:hover{background:#fff4f4;border-color:rgba(178,59,59,.25);box-shadow:none}
  .ico{font-size:15px;line-height:1}
  .btn-sm{padding:7px 14px;font-size:13px}
  .btn-large{padding:12px 24px;font-size:15px}
  .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:6px}

  /* الجدول/السجل */
  .filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
  .filters .field{min-width:130px}
  .period-filters{margin-bottom:8px}
  .period-count-chip{align-self:flex-end;min-height:34px;display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;color:var(--brand-deep);font-size:12.5px;font-weight:700}
  .period-count-chip.hidden{display:none}
  .action-filters{margin-top:-4px}
  .rec{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;
    background:#fff;display:flex;gap:18px;align-items:flex-start;
    box-shadow:0 1px 3px rgba(18,58,70,.05);transition:border-color .15s,box-shadow .15s}
  .rec:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(18,58,70,.10)}
  .rec-thumb{position:relative;flex:0 0 auto;width:92px;height:92px;border-radius:8px;
    overflow:hidden;border:1px solid var(--line);background:#f4f6f7;cursor:pointer}
  .rec-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .rec-thumb-count{position:absolute;left:6px;bottom:6px;background:rgba(18,58,70,.82);
    color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
  .rec-thumb-empty{display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:11px}
  .rec .meta{flex:1;min-width:0}
  .rec .ttl{font-weight:700;color:var(--brand-deep);font-size:16.5px;cursor:pointer;
    line-height:1.4;margin-bottom:6px}
  .rec .ttl:hover{text-decoration:underline}
  .rec .row2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .rec-facts{display:flex;flex-wrap:wrap;gap:8px 22px}
  .rec-facts .fact{display:flex;flex-direction:column;color:var(--brand-deep);
    font-size:13.5px;font-weight:600}
  .rec-facts .fact i{font-style:normal;color:var(--muted);font-size:11px;
    font-weight:500;margin-bottom:1px}
  .badge{display:inline-block;background:#eef2f4;border:1px solid var(--line);
    border-radius:5px;padding:3px 10px;font-size:12px;color:var(--brand-deep);font-weight:600}
  .badge.part{background:#f4efe2;border-color:#e3d6b5;color:var(--accent)}
  .badge.pending-badge{background:#fff7e6;border-color:#e6c982;color:#7a5a15}
  .rec .ops{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-start}
  .record-actions{align-items:stretch}
  .sync-note{display:inline-flex;align-items:center;gap:7px;margin:-2px 0 6px;
    padding:4px 9px;border:1px solid #e7d0a4;border-radius:999px;background:#fff8eb;
    color:#7a5a15;font-size:11.5px;font-weight:700}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#b7812c;
    box-shadow:0 0 0 3px rgba(183,129,44,.14)}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13.5px}

  /* لوحة المؤشرات */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;border-right:4px solid var(--brand);transition:all 0.3s ease;position:relative;overflow:hidden}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.06);border-color:#cbd6da}
  .kpi .n{font-size:28px;font-weight:800;color:var(--brand-deep);animation:fadeInUp 0.6s ease-out forwards}
  .kpi .l{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:14px}
  .grid-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px;text-align:right;cursor:pointer;transition:all 0.2s ease;display:flex;flex-direction:column;gap:10px}
  .grid-card:hover{transform:translateY(-3px);box-shadow:0 6px 15px rgba(26,77,92,0.08);border-color:#cbd6da}
  .gc-head{display:flex;justify-content:space-between;align-items:center;width:100%}
  .gc-lbl{font-size:13px;font-weight:600;color:var(--brand-deep)}
  .gc-v{font-size:22px;font-weight:bold}
  .gc-track{width:100%;height:6px;background:#eef2f4;border-radius:3px;overflow:hidden}
  .gc-fill{height:100%;border-radius:3px;animation:growRight 1s cubic-bezier(0.1,0.8,0.2,1) forwards;transform-origin:right}
  @keyframes growRight{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .vertical-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:220px;padding:20px 0 10px;margin-top:14px;overflow-x:auto}
  .v-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;background:none;border:none;cursor:pointer;height:100%;flex:1;min-width:35px;transition:opacity 0.2s}
  .v-bar-col:hover{opacity:0.8}
  .v-val{font-size:13px;font-weight:bold;color:var(--brand-deep);margin-bottom:2px}
  .v-track{width:28px;height:100%;background:#eef2f4;border-radius:6px 6px 0 0;display:flex;align-items:flex-end}
  .v-fill{width:100%;background:linear-gradient(180deg, var(--brand) 0%, rgba(26,77,92,0.5) 100%);border-radius:6px 6px 0 0;animation:growUp 1s cubic-bezier(0.1,0.8,0.2,1) forwards;transform-origin:bottom}
  .v-lbl{font-size:12px;color:var(--muted);font-weight:600;padding-top:4px}
  @keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}

  .bars{margin-top:6px}
  .dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:8px}
  .dash-head .hint{max-width:620px;text-align:right;line-height:1.7}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
  button.bar-row{width:100%;font-family:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:inherit}
  button.bar-row:hover .bar-track{outline:2px solid rgba(26,77,92,.12)}
  .bar-row .lbl{width:120px;color:var(--ink);text-align:left;flex:0 0 auto}
  .bar-track{flex:1;background:#eef2f4;border-radius:4px;height:14px;overflow:hidden}
  .bar-fill{height:100%;background:var(--brand);border-radius:4px}
  .bar-row .v{width:30px;color:var(--muted)}
  .dash-result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .dash-result-head h3{margin:0;color:var(--brand-deep);font-size:14px}
  .mini-records{display:grid;gap:8px}
  .mini-rec{border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px;
    display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:8px;align-items:center;font-size:12.5px}
  .mini-rec b{color:var(--brand-deep)}
  .mini-rec span{color:var(--muted)}
  .required-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .req-setting{border:1px solid var(--line);border-radius:6px;background:#fff;padding:11px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .req-setting b{display:block;color:var(--brand-deep);font-size:13px}
  .req-setting span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .req-setting.locked{background:#f7f9fa}
