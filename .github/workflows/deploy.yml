name: Deploy to Apps Script

# يعمل تلقائيًا عند كل دفع لتغييرات داخل src على فرع main
on:
  push:
    branches: [ main ]
    paths: [ 'src/**' ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Validate clasp auth
        id: clasp_auth
        # المحتوى الكامل لملف ~/.clasprc.json (يُحفظ كسرّ CLASPRC_JSON)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.CLASPRC_JSON || '';
          let valid = false;
          try {
            const parsed = JSON.parse(raw);
            valid = Boolean(parsed && parsed.token && parsed.token.access_token);
          } catch (error) {
            valid = false;
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `valid=${valid ? 'true' : 'false'}\n`);
          if (valid) {
            fs.writeFileSync(`${process.env.HOME}/.clasprc.json`, raw);
          } else {
            console.log('CLASPRC_JSON is missing or invalid; skipping Apps Script auto deploy.');
          }
          NODE

      - name: Push & Deploy
        if: steps.clasp_auth.outputs.valid == 'true'
        env:
          DID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          clasp push -f
          if [ -n "$DID" ]; then
            clasp deploy -i "$DID" -d "GitHub ${GITHUB_SHA:0:7}"
            echo "✓ نُشر التحديث على نفس الرابط الثابت."
          else
            echo "ℹ تم دفع الكود فقط (لم يُضبط سرّ DEPLOYMENT_ID لإعادة النشر)."
          fi

      - name: Skip Apps Script deploy
        if: steps.clasp_auth.outputs.valid != 'true'
        run: |
          echo "تم تخطي نشر Apps Script لأن سر CLASPRC_JSON غير مضبوط أو غير صالح."
          echo "GitHub Pages لا يحتاج هذا السر؛ المطلوب فقط لإرسال ملفات src إلى Apps Script تلقائيًا."
