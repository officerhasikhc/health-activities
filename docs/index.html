  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <img class="login-logo" src="assets/logo-login.png" alt="شعار وزارة الصحة">
      <div class="brand">منصة أثر</div>
      <div class="brand-sub">للمبادرات الصحية</div>
      <div class="org-name">
        المديرية العامة للخدمات الصحية بمحافظة ظفار<br>
        التجمّع الصحي (٢) — مركز صحي حاسك
      </div>
      <label style="display:block;text-align:right;margin-bottom:6px">الرقم الوظيفي</label>
      <input id="empNo" type="text" inputmode="numeric" placeholder="••••••" autocomplete="off">
      <label class="remember-row"><input type="checkbox" id="rememberEmp"> <span>تذكّر الرقم على هذا الجهاز</span></label>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
      <button class="btn btn-ghost install-btn" onclick="installApp()">تثبيت التطبيق</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="logo-box">
          <img src="assets/logo.png" alt="شعار وزارة الصحة">
        </div>
        <div class="org">
          <h1>المديرية العامة للخدمات الصحية بمحافظة ظفار</h1>
          <p>التجمّع الصحي (٢) — مركز صحي حاسك</p>
        </div>
        <div class="app-title"><span>منصة أثر</span><strong>للمبادرات الصحية</strong></div>
        <div class="topbar-spacer"></div>
        <span id="pending" class="pending hidden"></span>
        <div class="who">
          <b id="whoName"></b>
          <span id="whoTitle"></span>
        </div>
        <button class="btn-logout" onclick="logout()">خروج</button>
      </div>
    </header>

    <div class="cover"><span class="tag">توثيق الفعاليات والمبادرات</span></div>
    <nav class="tabs"><div class="tabs-inner" id="tabsBar"></div></nav>
