<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a4d5c">
  <meta name="robots" content="noindex">
  <title>منصة أثر — تم نقل الموقع</title>
  <link rel="icon" href="assets/logo-login.png">
  <link rel="apple-touch-icon" href="assets/logo-login.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #123a46, #1a4d5c 58%, #315b62);
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #1d2733;
      text-align: center;
      padding: 18px;
    }
    .card {
      background: #fff;
      border-top: 4px solid #9a7b3f;
      border-radius: 12px;
      box-shadow: 0 14px 50px rgba(0, 0, 0, .28);
      max-width: 440px;
      width: 100%;
      padding: 34px 28px;
    }
    .card img {
      width: 104px;
      height: 104px;
      object-fit: contain;
    }
    .brand { font-size: 26px; font-weight: 800; color: #1a4d5c; }
    .brand-sub { color: #9a7b3f; font-weight: 700; margin-top: 2px; }
    .org {
      color: #5b6b7b;
      font-size: 13px;
      line-height: 1.8;
      margin: 12px 0 20px;
    }
    .notice {
      background: #f6f1e7;
      border: 1px solid #e3d5b8;
      border-radius: 10px;
      padding: 20px 16px;
      font-size: 17px;
      font-weight: 700;
      color: #1a4d5c;
      line-height: 2;
    }
    .notice .icon { font-size: 34px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo-login.png" alt="شعار وزارة الصحة">
    <div class="brand">منصة أثر</div>
    <div class="brand-sub">للمبادرات الصحية</div>
    <div class="org">
      المديرية العامة للخدمات الصحية بمحافظة ظفار<br>
      التجمّع الصحي (٢) — مركز صحي حاسك
    </div>
    <div class="notice">
      <span class="icon">📍</span>
      تم نقل الموقع إلى رابط جديد.<br>
      يُرجى التواصل مع الإدارة للحصول على الرابط الجديد.
    </div>
  </main>
  <script>
    // تنظيف بقايا نسخة التطبيق السابقة (PWA): إلغاء تسجيل عامل الخدمة ومسح الكاش
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      }).catch(function () {});
    }
  </script>
</body>
</html>
